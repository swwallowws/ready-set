<!doctype html>
<html lang="en" data-category="transform">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ready Set</title>
<style>
/*__TOKENS__*/
/*__VALUEBOX_CSS__*/
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
/* The same scale as Session Notes' window, so the two read as one family inside Ableton Live:
   12px text, 11px labels, 10px tags, controls 24px tall, spacing on 8 / 16.
   The window is 400 x 420 (extension.ts). Few lines and boxes: space does the grouping. */
body { background:var(--ground); color:var(--ink); font:12px/1.4 var(--font-sans); font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
.iconbutton { --iconbutton-size:24px; --iconbutton-glyph:14px; }
.iconbutton[data-size="s"] { --iconbutton-size:20px; --iconbutton-glyph:12px; }
.ds-check > span { font-size:12px; line-height:16px; gap:8px; }
.ds-check > span::before { width:13px; height:13px; }
/* header: the wordmark, and Close on the right (the window's only way out besides Build) */
.head { flex:0 0 auto; height:40px; padding:0 8px 0 16px; display:flex; align-items:center; gap:8px; }
.wordmark { font:700 12px/1 var(--font-mono); display:flex; align-items:center; gap:8px; margin-right:auto; }
.wordmark svg { width:12px; height:12px; }
.head .iconbutton { border:0; background:none; color:var(--ink-mut); }
.head .iconbutton:hover { background:none; color:var(--ink); }
.view { flex:1 1 auto; min-height:0; overflow:auto; padding:8px 16px 16px; }
/* the start: the two ways in, centred in the window */
.view.centre { display:flex; flex-direction:column; justify-content:center; gap:32px; padding-bottom:40px; }
.group { display:grid; gap:10px; }
.group .cap { margin:0; }
.caprow { display:flex; align-items:center; justify-content:space-between; }
.cap { display:block; font:600 11px/1.3 var(--font-mono); letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink-mut); margin-bottom:8px; }
input[type=text] { width:100%; height:24px; padding:0 8px; background:var(--ground-2); border:var(--hairline);
  border-radius:var(--radius); color:var(--ink); font:12px var(--font-sans); outline:none; }
input[type=text]:focus-visible, button:focus-visible, .drop:focus-within { outline:2px solid var(--acc); outline-offset:1px; }
input[type=checkbox] { accent-color:var(--acc); }
.row { display:flex; gap:8px; }
button { font:12px/1 var(--font-sans); height:24px; padding:0 12px; border-radius:var(--radius); border:var(--hairline);
  background:var(--ground-2); color:var(--ink); cursor:pointer; white-space:nowrap; }
button:hover { background:var(--band); }
button.primary { background:var(--ink); color:var(--ground); border-color:var(--ink); font-weight:700; }
button.primary:hover { background:var(--ink); opacity:.85; }
button:disabled, button.primary:disabled { background:var(--ground-2); color:var(--ink-mut); border-color:var(--line); cursor:default; opacity:1; }
button[aria-pressed="true"] { border-color:var(--acc); color:var(--acc); }
button[aria-pressed="true"]:hover { background:var(--ground-2); }

/* find: one search field with its icon inside, the fan-made switch under it */
.field { position:relative; }
.field input[type=text] { height:28px; padding:0 32px 0 10px; border-color:var(--line); }
.field .iconbutton { position:absolute; right:2px; top:2px; border:0; background:none; }
/* your own file: a quiet line (the whole window takes a dropped file) */
.drop { display:flex; align-items:center; gap:10px; color:var(--ink-mut); cursor:pointer; }
.drop svg { width:16px; height:16px; flex:none; }
.drop b { color:var(--ink); font-weight:600; }
.drop u { text-decoration-color:var(--line); text-underline-offset:3px; }
.drop .fmt { display:block; font:10px var(--font-mono); margin-top:2px; }
.drop:hover u, .drop.over u { color:var(--ink); text-decoration-color:var(--acc); }
.drop.over b { color:var(--acc); }
/* "Sources": a small disclosure; the list shows over the window on hover, focus, or tap */
.srcs { position:relative; flex:0 0 auto; }
.srcs-btn { display:inline-flex; align-items:center; gap:4px; border:none; background:transparent; padding:1px 0;
  color:var(--ink-mut); font:500 10px/1.4 var(--font-mono); text-transform:uppercase; letter-spacing:.06em; cursor:help; }
.srcs-btn:hover { background:transparent; color:var(--ink); }
.srcs-btn svg { width:12px; height:12px; }
.srcs .tip { display:none; position:absolute; right:0; top:calc(100% + 6px); z-index:5; width:280px; padding:12px 14px;
  background:var(--ground-2); box-shadow:0 12px 32px -8px rgb(0 0 0 / .45); color:var(--ink-mut); font:11px/1.5 var(--font-mono);
  flex-direction:column; gap:6px; }
.srcs .tip b { color:var(--ink); font-weight:600; margin-right:4px; }
.srcs:hover .tip, .srcs:focus-within .tip, .srcs.open .tip { display:flex; }
/* Covers the gap under the button, so the tip stays open on the way to its copy button. */
.srcs .tip::before { content:""; position:absolute; left:0; right:0; top:-7px; height:7px; }

/* results: the count, "by source" when more than one answered (the filter line only on request,
   as plain words), then rows: play first (hear it here), the piece, its source, a chevron (it opens) */
.results-line { display:flex; align-items:baseline; gap:8px; margin-top:16px; color:var(--ink-mut); font:11px/1.4 var(--font-mono); }
.results-line .srcs { margin-left:auto; }
.by-source, .filters button { border:0; background:none; padding:0; color:var(--ink-mut); font:inherit; cursor:pointer;
  text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; }
.by-source:hover, .filters button:hover { background:none; color:var(--ink); }
.by-source[aria-expanded="true"] { color:var(--ink); }
.filters { display:flex; flex-wrap:wrap; gap:12px; margin-top:4px; font:11px/1.4 var(--font-mono); }
.filters button[aria-pressed="true"] { color:var(--ink); border:0; text-decoration-color:var(--acc); }
.results { margin-top:4px; }
.res { display:flex; flex-direction:column; }
.res:hover { background:var(--band); }
.res-top { display:flex; align-items:center; gap:8px; height:32px; padding:0 4px; }
.res-main { flex:1; min-width:0; height:auto; display:flex; align-items:baseline; gap:8px; border:0; background:none; padding:0;
  text-align:left; cursor:pointer; color:var(--ink); font:inherit; }
.res-main:hover { background:none; }
.res .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.res .src { flex:0 0 auto; color:var(--ink-mut); font:10px/1.4 var(--font-mono); text-transform:uppercase; letter-spacing:.04em; }
.res .go { flex:none; align-self:center; color:var(--ink-mut); }
.res:hover .go, .res-main:focus-visible .go { color:var(--acc); }
.res.loaded { padding-bottom:8px; }
canvas.iroll { width:calc(100% - 8px); margin:0 4px; height:48px; display:block; }

/* the open piece's bar: Transpose and Build into Set */
.foot { flex:0 0 auto; height:44px; padding:0 16px 8px; display:flex; align-items:center; gap:8px; }
.foot[hidden] { display:none; }
.foot .tr { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.foot .cap { margin:0; }
#tr { font-size:12px; }
.err { color:var(--ink); font-weight:600; font-size:11px; margin-top:8px; }
.err::before { content:"Error: "; }
.hint { color:var(--ink-mut); font-size:11px; margin-top:8px; }
.hint b { color:var(--ink); font-weight:600; }
/* the open piece: a way back, Play beside its name, the roll filling the rest, Transpose and Build below */
.view.pv { display:flex; flex-direction:column; }
.back { align-self:flex-start; border:none; background:transparent; color:var(--ink-mut); height:auto; padding:0; font:12px var(--font-sans); cursor:pointer; }
.back:hover { color:var(--ink); background:transparent; }
.pv-head { display:flex; align-items:center; gap:8px; margin-top:10px; min-width:0; }
.pv-title { font:600 12px var(--font-sans); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pv-sub { flex:none; color:var(--ink-mut); font:11px var(--font-mono); }
canvas#roll { flex:1 1 auto; min-height:120px; width:100%; display:block; margin-top:8px; cursor:pointer; touch-action:none; }
/* While a step runs in place: the window dims behind one quiet line. */
.busy { position:fixed; inset:0; z-index:10; display:grid; place-items:center;
  background:color-mix(in srgb, var(--ground) 72%, transparent);
  color:var(--ink); font:500 11px var(--font-mono); text-transform:uppercase; letter-spacing:.06em; }
.busy[hidden] { display:none; }
/* Late rows from a slow source, offered while something plays. */
.more-ready { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px;
  padding:4px 4px 4px 8px; border:var(--hairline); font:11px var(--font-mono); color:var(--ink-mut); }
.more-ready[hidden] { display:none; }
</style>
<script>/*__ROLL__*/</script>
<script>/*__VALUEBOX__*/</script>
<script>/*__ICONS__*/</script>
</head>
<body>
<div class="head">
  <div class="wordmark">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.5 12.5C4 12.5 5 4 8.5 4c2.6 0 3.4 5 6 5" stroke="var(--acc)" stroke-width="2"/></svg>Ready Set
  </div>
  <span id="head-x"></span>
</div>
<div class="view" id="view"></div>
<div class="foot" id="foot"></div>
<div class="busy" id="busy" role="status" aria-live="polite" hidden></div>

<script>
  let S = '__STATE__';                 // replaced with the injected state object at runtime
  // Served by the extension's local server: steps run without closing the
  // window, and only Build and Cancel close it. Otherwise every step closes
  // the window and the host reopens it.
  const LIVE = !!S.live;
  const view = document.getElementById('view');
  const foot = document.getElementById('foot');
  const R = window.TabridgeRoll;
  let pal = R.palette(document.documentElement);
  let sel = S.selectedUid ?? null;   // uid string of the selected row
  let semis = S.semitones || 0;
  let filter = 'all';   // results filter: "all" or a source key (midi/freemidi/mutopia/local-*)
  let players = [];                     // active makePlayer instances (for live transpose)
  const LABELS = { midi: 'BitMidi', freemidi: 'FreeMIDI', mutopia: 'Mutopia' };
  // Rows from a local source module carry their own label.
  const learnLabels = () => (S.results || []).forEach((r) => { if (r.label && !LABELS[r.source]) LABELS[r.source] = r.label; });
  learnLabels();
  const srcLabel = (s) => LABELS[s] || s;
  // Icon buttons (the design's iconbutton): the label is the accessible name and the tooltip.
  const icon = (name) => window.DesignIcons.iconSvg(name);
  const ib = (id, name, label, { cls = '', size = 'm', attrs = '' } = {}) =>
    '<button type="button" class="iconbutton' + (cls ? ' ' + cls : '') + '" data-size="' + size + '"' +
    (id ? ' id="' + id + '"' : '') + ' aria-label="' + label + '" title="' + label + '"' + attrs + '>' + icon(name) + '</button>';
  // A play button shows pause while it plays; its name stays "Play".
  const paintPlay = (btn, on) => { btn.innerHTML = icon(on ? 'pause' : 'play'); btn.title = on ? 'Pause' : 'Play';
    btn.setAttribute('aria-pressed', String(on)); };

  const esc = (s) => (s || "").toString().replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function closeWith(obj) {
    const msg = { method: "close_and_send", params: [JSON.stringify(obj)] };
    try { window.webkit.messageHandlers.live.postMessage(msg); return; } catch (e) {}
    try { window.chrome.webview.postMessage(msg); return; } catch (e) {}
  }
  function send(obj) {
    if (LIVE && obj.action !== 'build' && obj.action !== 'cancel') return ask(obj);
    closeWith(obj);
  }
  // A slow source left out of a search (BitMidi has taken 32 s) keeps going on
  // the host. Once per search, ask in the background for its rows; they're
  // added at the end of the list. If something is playing when they arrive,
  // don't cut it off: offer them with a Show button instead.
  let moreFor = 0, moreReady = null;
  function askMore() {
    if (!LIVE || !(S.pending && S.pending.length) || moreFor === S.searchSeq) return;
    moreFor = S.searchSeq;
    const seq = S.searchSeq, names = S.pending.join(', ');
    fetch('/act' + location.search, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'more', seq, background: true }),
    }).then((r) => (r.ok ? r.json() : null)).then((next) => {
      if (!next || next.searchSeq !== seq || S.searchSeq !== seq) return;
      next.moreFrom = names;
      if (S.mode === 'results' && !busy && !players.some((p) => p.isPlaying())) return applyMore(next);
      moreReady = next; offerMore();
    }).catch(() => {});
  }
  // Redraw with the late rows, keeping what's selected and the transpose.
  function applyMore(next) {
    moreReady = null;
    const keepSel = sel, keepSemis = semis;
    players.forEach((p) => p.stop(false));
    S = Object.assign({}, next, { selectedUid: keepSel, semitones: keepSemis, intro: null, error: S.error });
    sel = keepSel; semis = keepSemis;
    learnLabels(); render();
  }
  function offerMore() {
    const el = document.getElementById('more-ready');
    const n = moreReady ? moreReady.results.length - (S.results || []).length : 0;
    if (!el || !moreReady || moreReady.searchSeq !== S.searchSeq || S.mode !== 'results' || n <= 0) return;
    el.innerHTML = '<span>' + esc(moreReady.moreFrom) + ' found ' + n + ' more</span>' + ib('more-show', 'plus', 'Show them');
    el.hidden = false;
    document.getElementById('more-show').onclick = () => applyMore(moreReady);
    const line = view.querySelector('.pending'); if (line) line.remove();
  }

  // A step in place: post it to the local server, then redraw from the state it
  // answers with. The cover only shows if the step takes a moment, so quick
  // ones (back, home) don't flash.
  const BUSY = { search: 'Searching…', quickload: 'Loading…', preview: 'Loading preview…', file: 'Reading the file…' };
  let busy = false;
  async function ask(obj) {
    if (busy) return;
    busy = true;
    const cover = document.getElementById('busy');
    const t = setTimeout(() => { cover.textContent = BUSY[obj.action] || 'One moment…'; cover.hidden = false; }, 150);
    let next;
    try {
      const r = await fetch('/act' + location.search, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj),
      });
      if (!r.ok) throw new Error((await r.text()) || 'HTTP ' + r.status);
      next = await r.json();
    } catch (e) {
      next = Object.assign({}, S, { error: 'Something went wrong: ' + (e && e.message ? e.message : e) });
    }
    clearTimeout(t); cover.hidden = true; busy = false;
    players.forEach((p) => p.stop(false));
    if (obj.action === 'search') filter = 'all';
    S = next; sel = S.selectedUid ?? null; semis = S.semitones || 0;
    learnLabels();
    render();
    offerMore();   // late rows that came in while this step ran
  }
  const uploadsOn = () => { const c = document.getElementById('uploads'); return c ? c.checked : !!S.uploads; };
  const doSearch = (v) => { const q = (v || "").trim(); if (q) send({ action: "search", query: q, uploads: uploadsOn() }); };

  // Read a file the user picked or dropped and hand its bytes (base64) to the
  // host, which sniffs the format (MIDI, Guitar Pro, else MusicXML) and parses
  // it with the same WASM core as the website.
  function openFile(file) {
    if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      const bytes = new Uint8Array(rd.result);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      send({ action: "file", name: file.name, data: btoa(bin), semitones: semis });
    };
    rd.readAsArrayBuffer(file);
  }
  function wireFile() {
    const input = document.getElementById('file'), drop = document.getElementById('drop');
    if (!input) return;
    input.addEventListener('change', () => openFile(input.files && input.files[0]));
    ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'dragend'].forEach((t) => drop.addEventListener(t, () => drop.classList.remove('over')));
    drop.addEventListener('drop', (e) => { e.preventDefault(); e.stopPropagation(); drop.classList.remove('over');
      openFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]); });
  }
  // The window also accepts a drop anywhere, so a file dragged from Finder
  // onto the modal isn't opened as a page by the webview.
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => { e.preventDefault(); if (S.mode !== 'preview') openFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]); });

  // ---- shared audio engine ------------------------------------------------
  let AC = null, acUnlocked = false;
  const ac = () => {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    // WKWebView (Live's webview) keeps a context muted until a silent buffer is
    // played inside a real user gesture; resume() alone isn't enough. Do that
    // once, the first time ac() runs from a click.
    if (!acUnlocked) {
      try { const b = AC.createBuffer(1, 1, 22050); const s = AC.createBufferSource();
        s.buffer = b; s.connect(AC.destination); s.start(0); acUnlocked = true; } catch (e) {}
    }
    return AC;
  };
  const midiFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);
  let NB = null;
  function noise(a) { if (NB) return NB; const len = Math.floor(a.sampleRate * 0.4);
    const b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; NB = b; return b; }
  // Minimal GM drum synth: returns the nodes it started (so they can be stopped).
  function drumHit(a, dest, n, t) {
    const g = a.createGain(); g.connect(dest); const out = [];
    if (n === 35 || n === 36) {                                   // kick
      const o = a.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.11);
      g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g); o.start(t); o.stop(t + 0.22); out.push(o);
    } else if (n === 38 || n === 40 || n === 37 || n === 39) {    // snare / clap
      const s = a.createBufferSource(); s.buffer = noise(a);
      const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400;
      s.connect(hp); hp.connect(g); g.gain.setValueAtTime(0.55, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      s.start(t); s.stop(t + 0.18); out.push(s);
    } else if (n === 42 || n === 44 || n === 46 || n >= 49) {     // hats / cymbals
      const s = a.createBufferSource(); s.buffer = noise(a);
      const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
      const dur = (n === 46 || n >= 49) ? 0.3 : 0.05;
      s.connect(hp); hp.connect(g); g.gain.setValueAtTime(0.32, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      s.start(t); s.stop(t + dur + 0.02); out.push(s);
    } else {                                                      // toms & the rest -> pitched
      const o = a.createOscillator(); o.type = 'sine'; const f = 110 * Math.pow(2, (n - 45) / 12);
      o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.7, t + 0.2);
      g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      o.connect(g); o.start(t); o.stop(t + 0.26); out.push(o);
    }
    return out;
  }

  // columnar {p,s,d,k,v,f arrays} -> [{p,s,d,k,v,f}]
  function decode(P) { const p = P.p || [], s = P.s || [], d = P.d || [], k = P.k || [], v = P.v || [], f = P.f || [], out = [];
    for (let i = 0; i < p.length; i++) out.push({ p: p[i], s: s[i], d: d[i], k: k[i], v: v[i], f: f[i] || 0 }); return out; }

  // One melodic note, voiced like the instrument its track gets in the set
  // (the host picks it by track name): f=1 a plucked string, as Tension;
  // f=2 a round bass, as Operator's sine; f=3 an electric piano, as Electric;
  // otherwise a soft two-oscillator pad, as Wavetable. Returns its oscillators; each keeps its own small detune in
  // o._cents, so live transpose moves it without losing the pad's spread.
  function voice(a, dest, n, st, endT) {
    const dur = Math.max(0.03, endT - st), peak = 0.3 + 0.35 * (n.v == null ? 0.8 : n.v), out = [];
    const g = a.createGain(); g.connect(dest);
    const osc = (type, cents, to) => {
      const o = a.createOscillator(); o.type = type; o._cents = cents;
      o.frequency.setValueAtTime(midiFreq(n.p), st); o.detune.setValueAtTime(semis * 100 + cents, st);
      o.connect(to); out.push(o); return o;
    };
    let stopAt;
    if (n.f === 1) {
      // A pluck: bright at the attack, the filter closing and the level
      // falling away like a string.
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.2; lp.connect(g);
      lp.frequency.setValueAtTime(5200, st); lp.frequency.exponentialRampToValueAtTime(700, st + 0.35);
      osc('sawtooth', 0, lp);
      const decayEnd = st + Math.min(0.5, dur), relEnd = Math.max(decayEnd, endT) + 0.12;
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(peak, st + 0.004);
      g.gain.exponentialRampToValueAtTime(peak * 0.25, decayEnd);
      g.gain.setValueAtTime(peak * 0.25, relEnd - 0.12); g.gain.exponentialRampToValueAtTime(0.0001, relEnd);
      stopAt = relEnd;
    } else if (n.f === 3) {
      // An electric piano: a sine with a bright overtone that dies away fast
      // (the tine's bell at the attack), then a slow decay like a struck note.
      const bell = a.createGain(); bell.connect(g);
      bell.gain.setValueAtTime(0.5, st); bell.gain.exponentialRampToValueAtTime(0.001, st + 0.18);
      osc('sine', 0, g); osc('sine', 1200, bell);   // the overtone sits an octave up
      const decayEnd = st + Math.min(1.2, Math.max(0.05, dur)), relEnd = Math.max(decayEnd, endT) + 0.15;
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(peak * 0.62, st + 0.004);
      g.gain.exponentialRampToValueAtTime(peak * 0.28, decayEnd);
      g.gain.setValueAtTime(peak * 0.28, relEnd - 0.15); g.gain.exponentialRampToValueAtTime(0.0001, relEnd);
      stopAt = relEnd;
    } else if (n.f === 2) {
      // A bass: a sine with a little triangle for edge, quick to speak.
      const edge = a.createGain(); edge.gain.value = 0.25; edge.connect(g);
      osc('sine', 0, g); osc('triangle', 0, edge);
      const rel = Math.min(0.08, dur * 0.4);
      g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(peak * 0.5, st + 0.006);
      g.gain.setValueAtTime(peak * 0.5, Math.max(st + 0.01, endT - rel)); g.gain.linearRampToValueAtTime(0.0001, endT);
      stopAt = endT;
    } else {
      // A pad: two saws a few cents apart through a soft filter, a gentle
      // attack and a short release.
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200; lp.Q.value = 0.4; lp.connect(g);
      osc('sawtooth', -7, lp); osc('sawtooth', 7, lp);
      const relEnd = endT + 0.15;
      g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(peak * 0.55, st + Math.min(0.03, dur * 0.5));
      g.gain.setValueAtTime(peak * 0.55, Math.max(st + 0.01, endT)); g.gain.linearRampToValueAtTime(0.0001, relEnd);
      stopAt = relEnd;
    }
    out.forEach((o) => { o.start(st); o.stop(stopAt + 0.03); });
    return out;
  }

  // A player bound to a canvas + play button. Live transpose sets each note's
  // detune at schedule time and updates every currently-sounding oscillator in
  // retune(), so moving the slider shifts every sounding note in the track at once.
  // The roll follows roll.md: key bands, accent shades by pitch, drums as an
  // --ink-mut lane underneath, the playhead in the accent.
  function makePlayer(cfg) {
    const { canvas, playBtn, controllable } = cfg;
    const notes = cfg.notes, tempo = cfg.tempo || 120, beats = cfg.beats || 32;
    const ctx = canvas.getContext('2d');
    const mel = notes.filter((n) => !n.k), drum = notes.filter((n) => n.k);
    // Sounding (or scheduled) sources; each removes itself when it ends, so a
    // whole song doesn't pile up thousands of finished nodes in memory.
    let nodes = new Set(), oscs = new Set(), playing = false, phStart = 0, raf = 0, pos = 0, schedTimer = 0;
    const track = (o, isOsc) => {
      nodes.add(o); if (isOsc) oscs.add(o);
      o.onended = () => { nodes.delete(o); oscs.delete(o); };
    };
    let cache = null, cw = 0, ch = 0, pMin = 0, pMax = 0;
    // The pitch span drawn, plus one empty row above and below, so the highest
    // and lowest notes don't sit under the frame and look cut off.
    function range() { pMin = 127; pMax = 0; mel.forEach((n) => { const p = n.p + semis; if (p < pMin) pMin = p; if (p > pMax) pMax = p; });
      if (pMax < pMin) { pMin = 48; pMax = 72; }
      pMin -= 1; pMax += 1; }
    range();
    function paint(w, h) {
      const off = document.createElement('canvas'); off.width = w; off.height = h; const c = off.getContext('2d');
      const lane = drum.length ? 8 : 0, rh = h - lane;
      const rows = pMax - pMin + 1, row = rh / rows;
      R.bands(c, pal, 0, 0, w, pMin, pMax, row, true);
      const x = (b) => (b / beats) * w, y = (p) => (pMax - p) * row;
      mel.forEach((n) => { const p = n.p + semis, nx = x(n.s), nw = Math.max(1, x(n.s + n.d) - nx - 0.5);
        R.note(c, pal, nx, y(p), nw, Math.max(2, row), R.shade(p, pMin, pMax), false); });
      if (drum.length) { c.fillStyle = pal.band; c.fillRect(0, rh, w, lane); c.fillStyle = pal.inkMut;
        drum.forEach((n) => { const nx = x(n.s); c.fillRect(nx, rh + 1, Math.max(1, x(n.s + n.d) - nx), lane - 2); }); }
      return off;
    }
    function draw() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2), r = canvas.getBoundingClientRect(), w = r.width, h = r.height;
      if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = w * dpr; canvas.height = h * dpr; cache = null; }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!cache || cw !== w || ch !== h) { cache = paint(w, h); cw = w; ch = h; }
      ctx.clearRect(0, 0, w, h); ctx.drawImage(cache, 0, 0, w, h);
      if (playing || pos > 0) { ctx.fillStyle = pal.acc; ctx.fillRect(Math.round((pos || 0) * w), 0, 1, h); }
    }
    function setBtn() { paintPlay(playBtn, playing); }
    function stop(rewind) { playing = false; if (rewind) pos = 0; cancelAnimationFrame(raf);
      if (schedTimer) { clearInterval(schedTimer); schedTimer = 0; }
      nodes.forEach((n) => { try { n.stop(); } catch (e) {} }); nodes = new Set(); oscs = new Set();
      setBtn(); draw(); }
    function play() {
      if (playing) { stop(false); return; }
      const a = ac(); const SPB = 60 / tempo, total = beats * SPB;
      if ((pos || 0) >= 0.999) pos = 0; const from = (pos || 0) * total, t0 = a.currentTime + 0.08;
      const master = a.createGain(); master.gain.value = 0.15;
      // Each voice filters itself; this only takes the harshest top off.
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000; lp.Q.value = 0.5;
      master.connect(lp); lp.connect(a.destination);
      // Look-ahead scheduler: only build nodes for the next second of notes as
      // playback advances, so the whole song stays light (no thousands of
      // oscillators created up front). A second ahead rides out a stall in
      // Live's webview (its own audio, a garbage collection) without a gap;
      // stop and transpose still reach scheduled notes at once. Notes arrive
      // already sorted by start.
      let mi = 0, di = 0; const LOOK = 1.0;
      function scheduleUpTo(horizon) {
        while (mi < mel.length) { const n = mel[mi]; const nStart = n.s * SPB; if (nStart >= horizon) break; mi++;
          const nDur = Math.max(0.05, n.d * SPB), nEnd = nStart + nDur; if (nEnd <= from) continue;
          const st = t0 + Math.max(0, nStart - from), endT = t0 + (nEnd - from);
          // Transpose is in each oscillator's detune; live-updated in retune().
          voice(a, master, n, st, endT).forEach((o) => track(o, true));
        }
        while (di < drum.length) { const n = drum[di]; const nStart = n.s * SPB; if (nStart >= horizon) break; di++;
          if (nStart + 0.25 <= from) continue; const st = t0 + Math.max(0, nStart - from);
          drumHit(a, master, n.p, st).forEach((x) => track(x, false)); }
      }
      playing = true; phStart = t0 - from; setBtn();
      scheduleUpTo(from + LOOK);
      schedTimer = setInterval(() => { if (!playing) return; scheduleUpTo((a.currentTime - t0) + from + LOOK); }, 80);
      // Reduced motion: keep the static marker where playback started.
      if (R.reducedMotion()) { draw(); return; }
      (function ph() { if (!playing) return; const p2 = a.currentTime - phStart;
        if (p2 >= total) { stop(true); return; } pos = p2 / total; draw(); raf = requestAnimationFrame(ph); })();
    }
    function retune() { range(); cache = null; draw();
      if (playing) { const now = ac().currentTime;
        oscs.forEach((o) => { try { o.detune.setValueAtTime(semis * 100 + (o._cents || 0), now); } catch (e) {} }); } }
    function repaint() { cache = null; draw(); }
    playBtn.onclick = play;
    if (controllable) {
      const seek = (e) => { const r = canvas.getBoundingClientRect();
        pos = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); draw(); };
      let drag = false, resume = false;
      canvas.addEventListener('pointerdown', (e) => { drag = true; resume = playing; if (playing) stop(false);
        seek(e); try { canvas.setPointerCapture(e.pointerId); } catch (x) {} });
      canvas.addEventListener('pointermove', (e) => { if (drag) seek(e); });
      const end = () => { if (!drag) return; drag = false; if (resume) play(); };
      canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
    }
    window.addEventListener('resize', repaint);
    draw();
    return { play, stop, retune, repaint, isPlaying: () => playing };
  }
  // Re-resolve colours when the system scheme flips (Live follows it).
  R.onSchemeChange(() => { pal = R.palette(document.documentElement); players.forEach((p) => p.repaint()); });

  // Transpose is the design system's value box, as on the website: click or
  // hold the top half to go up, the bottom half to go down (arrow keys too).
  function wireTranspose() {
    const tr = document.getElementById('tr');
    if (!tr) return;
    window.DesignValueBox.valueBox(tr, {
      min: -12, max: 12, value: semis, labelledBy: 'tr-label',
      format: (v) => (v > 0 ? '+' : '') + v,
      onChange: (v) => { semis = v; players.forEach((p) => p.retune()); },
    });
  }
  const transposeFoot = () =>
    '<div class="tr"><span class="cap" id="tr-label">Transpose</span><span id="tr"></span></div>';
  // The opt-in checkbox stays short; which sources are searched lives in a small
  // "Sources" disclosure beside it (hover, keyboard focus, or tap to show).
  const sourcesTip = () =>
    '<span class="srcs" id="srcs"><button type="button" class="srcs-btn" id="srcs-btn" aria-describedby="srcs-tip" aria-expanded="false">' +
      '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.25" fill="none" stroke="currentColor"/><path d="M6 5.2v3.3M6 3.3v.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Sources</button>' +
      '<span class="tip" role="tooltip" id="srcs-tip">' +
        '<span><b>Mutopia</b> public-domain scores, always searched</span>' +
        '<span><b>BitMidi</b> fan-made MIDI, searched when included</span>' +
        '<span><b>FreeMIDI</b> fan-made MIDI, searched when included. Free and ad-supported: support it at freemidi.org</span>' +
      '</span></span>';
  const uploadsBox = () =>
    '<label class="ds-check"><input type="checkbox" id="uploads"' + (S.uploads ? ' checked' : '') + ' />' +
    '<span>Include fan-made MIDI (fine for practice, not for release)</span></label>';
  let srcsOutside = null;
  function wireSources() {
    const box = document.getElementById('srcs'), btn = document.getElementById('srcs-btn');
    if (!box) return;
    const set = (on) => { box.classList.toggle('open', on); btn.setAttribute('aria-expanded', String(on)); };
    btn.onclick = (e) => { e.preventDefault(); set(!box.classList.contains('open')); };
    btn.addEventListener('keydown', (e) => { if (e.key === 'Escape') { set(false); btn.blur(); } });
    // One outside-click listener at a time: the window redraws in place.
    if (srcsOutside) document.removeEventListener('pointerdown', srcsOutside);
    srcsOutside = (e) => { if (!box.contains(e.target)) set(false); };
    document.addEventListener('pointerdown', srcsOutside);
  }

  // ---- views --------------------------------------------------------------
  // Two views, as the studio: find (a search, your own file as one line, the results under
  // them) and the open piece (playing at once, with Transpose and Build into Set). A row's
  // play button hears it in the list; a click on the row opens it.
  let filterOpen = false;            // the source filter line, only when asked for
  let autoplayNext = false;          // an open piece plays at once when a click opened it in place
  const BUILT_HINT = 'Builds into the <b>Set you have open</b>. Open a new Set (⌘N) first for a clean start.';
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

  function render() {
    players = [];
    // Close lives in the header on every view; the bar under the window only holds
    // the open piece's Transpose and Build into Set.
    document.getElementById('head-x').innerHTML = ib('cancel', 'close', 'Close');
    view.classList.remove('centre', 'pv');
    foot.hidden = S.mode !== "preview";
    if (S.mode === "preview") renderPiece(); else renderFind();
    document.getElementById('cancel').onclick = () => send({ action: "cancel" });
  }

  function renderFind() {
    const results = S.mode === 'results' ? S.results : [];
    // A row's intro notes are prefetched (S.results[i].intro) so its play button sounds
    // in the list on the same click. Rows past the prefetch window load on the host
    // (quickload); coming back from one, S.intro carries that row's notes.
    const byId = {};
    results.forEach((r) => { byId[r.uid] = r; });
    if (S.intro && byId[S.intro.uid]) byId[S.intro.uid].intro = S.intro;
    const srcs = [...new Set(results.map((r) => r.source))];
    if (srcs.length < 2) filterOpen = false;
    const rows = results.map((r) => {
      const play = ib('', 'play', 'Play ' + r.title, { cls: 'res-play', size: 's', attrs: ' data-' + (r.intro ? 'inline' : 'load') + '="' + r.uid + '"' });
      const src = srcLabel(r.source) + (r.tracks != null ? ' · ' + plural(r.tracks, 'track') : '');
      return '<div class="res" id="row-' + r.uid + '" data-song="' + r.uid + '" data-source="' + r.source + '">' +
        '<div class="res-top">' + play +
        '<button type="button" class="res-main" data-pick="' + r.uid + '" aria-label="Open ' + esc(r.artist ? r.artist + ', ' + r.title : r.title) + '">' +
        '<span class="t">' + esc(r.artist ? r.artist + ' · ' + r.title : r.title) + '</span>' +
        '<span class="src">' + esc(src) + '</span>' +
        '<span class="go">' + window.DesignIcons.iconSvg('chevron', { dir: 'right' }) + '</span></button></div></div>';
    }).join('');
    const resultsBlock = S.mode !== 'results' ? '' :
      '<div class="results-line"><span>' + (results.length ? plural(results.length, 'result') : 'No results.') + '</span>' +
        (srcs.length > 1 ? '<button type="button" class="by-source" id="by-source" aria-expanded="' + filterOpen + '">by source</button>' : '') +
        sourcesTip() + '</div>' +
      (srcs.length > 1 && filterOpen
        ? '<div class="filters" role="group" aria-label="Show results from">' + ['all', ...srcs].map((f) =>
            '<button type="button" data-filter="' + f + '" aria-pressed="' + (filter === f) + '">' + (f === 'all' ? 'All' : esc(srcLabel(f))) + '</button>').join('') + '</div>'
        : '') +
      (rows ? '<div class="results">' + rows + '</div>' : '') +
      (LIVE && S.pending && S.pending.length ? '<div class="hint pending">Still searching ' + esc(S.pending.join(', ')) + '…</div>' : '') +
      '<div class="more-ready" id="more-ready" hidden></div>';
    // The start: two ways in, centred. "Find a song" with Sources on its line, above
    // the field, so the fan-made line stays on one line; then your own file. Once
    // you've searched, the field and the switch stay on top, the results under
    // them, and Sources moves to the results line (a file still drops anywhere).
    // autocomplete off: Live's webview otherwise drops its own list of past entries under the field
    const field = '<div class="field"><input type="text" id="q" placeholder="Song or artist" aria-label="Song or artist" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="' + esc(S.query) + '" />' + ib('go', 'search', 'Search') + '</div>';
    const err = S.error ? '<div class="err">' + esc(S.error) + '</div>' : '';
    const start = S.mode !== 'results';
    view.classList.toggle('centre', start);
    view.innerHTML = start
      ? '<div class="group"><div class="caprow"><span class="cap">Find a song</span>' + sourcesTip() + '</div>' + field + uploadsBox() + err + '</div>' +
        '<div class="group"><span class="cap">Or bring your own</span>' +
          '<label class="drop" id="drop" for="file">' +
            '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 11v2.5h11V11"/></svg>' +
            '<span><b>Drop a tab or a score</b> anywhere here, or <u>choose one</u><span class="fmt">.gp · .gpx · .gp3 to .gp5 · .musicxml</span></span>' +
            '<input type="file" id="file" accept=".gp,.gpx,.gp3,.gp4,.gp5,.musicxml,.xml" hidden /></label></div>'
      : '<div class="group">' + field + uploadsBox() + err + '</div>' + resultsBlock;

    // Filter rows by source without re-rendering (keeps any playing audio).
    function applyFilter(f) { filter = f;
      view.querySelectorAll('.filters button').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.filter === f)));
      view.querySelectorAll('.res').forEach((el) => { el.style.display = (f === 'all' || el.dataset.source === f) ? '' : 'none'; }); }
    const bySource = document.getElementById('by-source');
    if (bySource) bySource.onclick = () => { filterOpen = !filterOpen; if (!filterOpen) filter = 'all'; render(); };
    view.querySelectorAll('.filters button').forEach((c) => (c.onclick = () => applyFilter(c.dataset.filter)));
    applyFilter(filterOpen && srcs.includes(filter) ? filter : 'all');

    // A row's play button: its intro in a small roll under the row, one row at a time.
    let open = null; // { uid, player, btn, rec }
    function closeOpen() {
      if (!open) return;
      const o = open; open = null;
      try { o.player.stop(true); } catch (e) {}
      const i = players.indexOf(o.player); if (i >= 0) players.splice(i, 1);
      const row = document.getElementById('row-' + o.uid);
      if (row) { row.classList.remove('loaded'); const c = row.querySelector('.iroll'); if (c) c.remove(); }
      paintPlay(o.btn, false);
      o.btn.onclick = () => playInline(o.rec, o.btn);   // fresh trigger for reuse
    }
    function showIntro(rec, btn, play) {
      const row = document.getElementById('row-' + rec.uid); row.classList.add('loaded');
      const cv = document.createElement('canvas'); cv.className = 'iroll'; row.appendChild(cv);
      const p = makePlayer({ notes: decode(rec.intro), tempo: rec.intro.tempo, beats: rec.intro.beats, canvas: cv, playBtn: btn, controllable: true });
      players.push(p); open = { uid: rec.uid, player: p, btn, rec };
      if (play) p.play();                               // a real click: audio starts on it
    }
    function playInline(rec, btn) { closeOpen(); showIntro(rec, btn, true); }
    view.querySelectorAll('.res-play[data-inline]').forEach((b) => (b.onclick = () => playInline(byId[b.dataset.inline], b)));
    view.querySelectorAll('.res-play[data-load]').forEach((b) => (b.onclick = () => {
      if (LIVE) ac();                                   // unlock audio inside this click, so the intro can start when it arrives
      send({ action: "quickload", uid: b.dataset.load, semitones: semis }); }));
    // A click on the row opens the piece, playing at once when it opens in place.
    view.querySelectorAll('.res-main').forEach((b) => (b.onclick = () => {
      players.forEach((p) => p.stop(false));
      sel = b.dataset.pick;
      if (LIVE) { ac(); autoplayNext = true; }
      send({ action: "preview", uid: sel, semitones: semis }); }));
    // Back from an on-click load: that row's intro opens under it, playing if it can.
    if (S.intro && byId[S.intro.uid]) {
      const btn = document.getElementById('row-' + S.intro.uid)?.querySelector('.res-play');
      if (btn) showIntro(byId[S.intro.uid], btn, LIVE && S.intro.autoplay);
    }

    const q = document.getElementById('q');
    document.getElementById('go').onclick = () => { filterOpen = false; doSearch(q.value); };
    q.addEventListener('keydown', (e) => { if (e.key === 'Enter') { filterOpen = false; doSearch(q.value); } });
    wireFile();
    wireSources();
    if (S.mode === 'results') askMore();
  }

  function renderPiece() {
    const P = S.preview || { p: [], tempo: 120, beats: 32 };
    const sub = Math.round(P.tempo) + ' BPM' + (P.truncated ? ' · the first part' : '');
    view.classList.add('pv');
    view.innerHTML =
      '<button class="back" id="back">← ' + (S.previewFrom === 'results' ? 'results' : 'back') + '</button>' +
      '<div class="pv-head">' + ib('play', 'play', 'Play') + '<span class="pv-title">' + esc(P.label) + '</span><span class="pv-sub">' + esc(sub) + '</span></div>' +
      '<canvas id="roll" aria-label="Piano roll of the piece; click or drag to move the playhead"></canvas>' +
      (S.error ? '<div class="err">' + esc(S.error) + '</div>' : '') +
      '<div class="hint">' + BUILT_HINT + '</div>';
    foot.innerHTML = transposeFoot() + '<button class="primary" id="build2">Build into Set</button>';
    const p = makePlayer({ notes: decode(P), tempo: P.tempo, beats: P.beats,
      canvas: document.getElementById('roll'), playBtn: document.getElementById('play'), controllable: true });
    players.push(p);
    wireTranspose();
    if (autoplayNext) { autoplayNext = false; p.play(); }
    document.getElementById('back').onclick = () => { players.forEach((x) => x.stop(false)); send({ action: "back", semitones: semis }); };
    document.getElementById('build2').onclick = () => { players.forEach((x) => x.stop(false)); send({ action: "build", uid: sel, semitones: semis }); };
  }
  render();
  // Repaint once the inlined fonts are ready, so canvas labels use them.
  if (document.fonts) document.fonts.ready.then(() => players.forEach((p) => p.repaint()));
</script>
</body>
</html>
